name: PR601 proof diagnostics

on:
  push:
    branches: [codex/pr601-proof-diagnostics]
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: grid
        options: [grid, scaling, generators, properties, normalization, arithmetic, grisu-generators, arithmetic-properties, exact-digits]
      groups:
        description: Optional JSON array of named diagnostic groups
        type: string
        default: ''
      modes:
        description: Optional JSON array of integer solver modes
        type: string
        default: ''
      seconds:
        description: Timeout for each direct SMT diagnostic, at most 2400 seconds
        type: string
        default: '600'
      runner:
        type: choice
        options: [ubuntu-latest, macos-latest]
        default: ubuntu-latest
      artifact_run:
        description: Optional run containing a previously compiled proof
        type: string
        default: ''
      artifact_name:
        type: string
        default: ''
      harness:
        description: Optional compiled harness to check directly
        type: string
        default: ''
      property_smt:
        description: Use integer SMT for individual assertion diagnostics
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  proofs:
    if: inputs.suite != 'properties' && inputs.suite != 'arithmetic-properties'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.groups || inputs.suite == 'exact-digits' && '["exact-digits-16","exact-digits-32"]' || inputs.suite == 'grisu-generators' && '["grisu-shortest-fixed-exponent","grisu-shortest-cached-power-39"]' || inputs.suite == 'arithmetic' && '["arithmetic-kissat","arithmetic-smt-sum","arithmetic-smt-off"]' || inputs.suite == 'normalization' && '["grisu-shortest-normalization-contract","normalization-scaling-kissat","normalization-scaling-smt"]' || inputs.suite == 'generators' && '["dragon-shortest-fixed-exponent","dragon-exact-fixed-exponent"]' || inputs.suite == 'scaling' && '["scaling-profile","scaling-refinement","scaling-flat-smt"]' || '["bigint-shift-equivalence-000-031","bigint-shift-equivalence-032-063","bigint-shift-equivalence-064-095","bigint-shift-equivalence-096-127","bigint-shift-equivalence-128-159","bigint-shift-equivalence-160-191","bigint-shift-equivalence-192-223","bigint-shift-equivalence-224-229","scaling-profile"]') }}
    env:
      CARGO_BUILD_JOBS: 2
      RAYON_NUM_THREADS: 1
      KANI_JOBS: 1
      KANI_PATCHED_CBMC: 'true'
      KANI_OBJECT_BITS: ${{ (inputs.suite == 'generators' || inputs.suite == 'grisu-generators' || inputs.suite == 'exact-digits') && '14' || '12' }}
      PROOF_TIMEOUT: ${{ inputs.suite == 'generators' && '3600s' || (inputs.suite == 'grisu-generators' || inputs.suite == 'exact-digits') && '1800s' || '420s' }}
      KANI_SYMEX_CACHE_DEREFERENCES: 'true'
      KANI_ARRAY_FIELD_SENSITIVITY: 'true'
      HARNESS_GROUP: ${{ matrix.group }}
      SOLVER: ${{ (matrix.group == 'scaling-refinement' || matrix.group == 'scaling-flat-smt' || matrix.group == 'normalization-scaling-smt' || startsWith(matrix.group, 'arithmetic-smt-')) && 'minisat' || 'kissat' }}
      KANI_FLAT_SMT_Z3: ${{ (matrix.group == 'scaling-flat-smt' || matrix.group == 'normalization-scaling-smt') && 'true' || 'false' }}
      KANI_ARITHMETIC_REFINEMENT: ${{ matrix.group == 'scaling-refinement' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup
      - name: Install build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison clang libclang-dev gdb
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew trust diffblue/cbmc
          brew install cmake ninja flex bison
      - uses: actions/cache@v4
        with:
          path: cbmc_build/bin
          key: cbmc-flat-smt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-flat-smt-cbmc.sh') }}
      - name: Build verifier and proof artifacts
        run: |
          scripts/run-kani.sh --kani-args --jobs 1 --only-codegen --exact \
            --harness num::imp::flt2dec::strategy::grisu::grisu_verify::check_scale_shortest_73
      - uses: actions/cache/save@v4
        with:
          path: cbmc_build/bin
          key: cbmc-flat-smt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-flat-smt-cbmc.sh') }}
      - name: Select proof cases
        run: |
          if [[ "$HARNESS_GROUP" == scaling-* || "$HARNESS_GROUP" == normalization-scaling-* ]]; then
            echo num::imp::flt2dec::strategy::grisu::grisu_verify::check_scale_shortest_73 > harnesses.txt
          elif [[ "$HARNESS_GROUP" == arithmetic-* ]]; then
            if [[ "$HARNESS_GROUP" == *scaling-full* ]]; then
              echo num::imp::flt2dec::strategy::grisu::grisu_verify::check_scale_shortest_73 > harnesses.txt
            elif [[ "$HARNESS_GROUP" == *interval* ]]; then
              echo num::imp::flt2dec::strategy::grisu::grisu_verify::check_scaling_interval_73 > harnesses.txt
            else
              echo num::imp::flt2dec::strategy::grisu::grisu_verify::check_scaling_arithmetic_73 > harnesses.txt
            fi
          elif [[ "$HARNESS_GROUP" == exact-digits-* ]]; then
            echo "num::imp::flt2dec::strategy::dragon::dragon_verify::check_format_exact_${HARNESS_GROUP##*-}_digits" > harnesses.txt
          else
            python3 -I scripts/kani-std-analysis/flt2dec_harnesses.py --group "$HARNESS_GROUP" > harnesses.txt
          fi
      - name: Install arithmetic diagnostic solver
        if: startsWith(matrix.group, 'arithmetic-smt-')
        run: |
          curl --fail --location --retry 3 --output cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.1/cvc5-Linux-x86_64-static.zip
          echo '6d44abc233980a14d72cc5809287d27c3335b1d6ee863381d0b5ffcbd0d8de56  cvc5.zip' | sha256sum --check
          unzip -q cvc5.zip
          cat > cvc5-wrapper.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec ./cvc5-Linux-x86_64-static/bin/cvc5 --lang=smt2 --solve-bv-as-int="${HARNESS_GROUP##*-}" "$@"
          SH
          chmod +x cvc5-wrapper.sh
      - name: Verify selected proof cases
        run: |
          (
            while sleep 60; do
              date -u +%FT%TZ
              ps -A -o pid=,rss=,comm= | awk '$3 ~ /(^|\/)(cbmc|kissat|cvc5)$/ { print "solver RSS KiB:", $0 }'
            done
          ) &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          if [[ "$HARNESS_GROUP" == scaling-profile ]]; then
            (
              for _attempt in {1..60}; do
                cbmc_pid=$(pgrep -nx cbmc || true)
                if [[ -n "$cbmc_pid" ]]; then
                  sleep 90
                  sudo gdb -batch -ex 'set pagination off' -ex 'thread apply all bt 30' -p "$cbmc_pid" 2>&1 | tee cbmc-stack.txt || true
                  break
                fi
                sleep 10
              done
            ) &
          fi
          harness_args=()
          while IFS= read -r harness; do
            harness_args+=(--harness "$harness")
          done < harnesses.txt
          if [[ "$HARNESS_GROUP" == arithmetic-smt-* ]]; then
            export KANI_DIAGNOSTIC_SMT2_SOLVER="$PWD/cvc5-wrapper.sh"
          fi
          set -o pipefail
          scripts/run-kani.sh --kani-args --jobs 1 --harness-timeout "$PROOF_TIMEOUT" \
            --solver "$SOLVER" --output-format regular --exact "${harness_args[@]}" \
            2>&1 | tee proofs.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-log-${{ matrix.group }}
          path: |
            proofs.log
            cbmc-stack.txt
            target/kani_verify_std/target/**/out/*check_scale_shortest_73.out
            target/kani_verify_std/target/**/out/*check_normalize_shortest.out
            target/kani_verify_std/target/**/out/*check_scaling_arithmetic_73.out
            target/kani_verify_std/target/**/out/*check_scaling_interval_73.out
          if-no-files-found: ignore

  scaling-properties:
    if: inputs.suite == 'properties'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PROPERTY_SHARD: ${{ matrix.shard }}
      INPUT_HARNESS: ${{ inputs.harness || 'check_scale_shortest_73' }}
      PROPERTY_SMT: ${{ inputs.property_smt && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: cbmc_build/bin
          key: cbmc-flat-smt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-flat-smt-cbmc.sh') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'proof-log-normalization-scaling-kissat' }}
          run-id: ${{ inputs.artifact_run || '38451513946' }}
          github-token: ${{ github.token }}
          path: proof-input
      - name: Select diagnostic assertions
        run: |
          shopt -s globstar nullglob
          goto_files=(proof-input/**/*"$INPUT_HARNESS".out)
          [[ ${#goto_files[@]} == 1 ]]
          cp "${goto_files[0]}" scaling.out
          cbmc_build/bin/cbmc --show-properties --json-ui scaling.out > properties.json
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          records = json.loads(Path('properties.json').read_text())
          properties = next(record['properties'] for record in records if 'properties' in record)
          def active_function(prop):
              function = prop['sourceLocation'].get('function', '')
              if os.environ['INPUT_HARNESS'] == 'check_scale_shortest_73':
                  return 'scale_shortest_contract' in function and '{closure#2}::{closure#1}' in function
              return os.environ['INPUT_HARNESS'] in function

          selected = [prop['name'] for prop in properties
                      if active_function(prop)
                      and (prop['description'].startswith('assertion failed:')
                           or 'postcondition' in prop['description'].lower()
                           or 'post-condition' in prop['description'].lower())]
          shard = int(os.environ['PROPERTY_SHARD'])
          chosen = selected[shard::4]
          assert chosen, (shard, selected)
          Path('selected-properties.txt').write_text('\n'.join(chosen) + '\n')
          print(f'Selected {len(chosen)} of {len(selected)} diagnostic properties')
          PY
      - name: Install per-property SMT solver
        if: inputs.property_smt
        run: |
          curl --fail --location --retry 3 --output cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.1/cvc5-Linux-x86_64-static.zip
          echo '6d44abc233980a14d72cc5809287d27c3335b1d6ee863381d0b5ffcbd0d8de56  cvc5.zip' | sha256sum --check
          unzip -q cvc5.zip
          cat > cvc5-wrapper.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec ./cvc5-Linux-x86_64-static/bin/cvc5 --lang=smt2 --solve-bv-as-int=sum "$@"
          SH
          chmod +x cvc5-wrapper.sh
      - name: Time individual assertions
        run: |
          mkdir property-results
          failed=0
          index=0
          solver_args=()
          if [[ "$PROPERTY_SMT" == true ]]; then
            solver_args=(--bitwuzla --external-smt2-solver ./cvc5-wrapper.sh)
          fi
          while IFS= read -r property; do
            index=$((index + 1))
            set +e
            timeout --kill-after=5 90 cbmc_build/bin/cbmc \
              --no-malloc-may-fail --no-undefined-shift-check --no-signed-overflow-check \
              --nan-check --no-self-loops-to-assumptions --no-pointer-primitive-check \
              --slice-formula --object-bits 12 --symex-cache-dereferences \
              --property "$property" --verbosity 9 --json-ui "${solver_args[@]}" scaling.out \
              > "property-results/$index.json" 2> "property-results/$index.stderr"
            result=$?
            set -e
            printf '%s\t%s\n' "$result" "$property" | tee -a property-summary.tsv
            if [[ $result != 0 ]]; then failed=1; fi
          done < selected-properties.txt
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling-properties-${{ matrix.shard }}
          path: |
            properties.json
            selected-properties.txt
            property-summary.tsv
            property-results

  scaling-integer-smt:
    if: inputs.suite == 'arithmetic-properties'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.modes || '["sum","iand","off"]') }}
    env:
      INTEGER_MODE: ${{ matrix.mode }}
      SOLVER_TIMEOUT: ${{ inputs.seconds || '600' }}
      INPUT_HARNESS: ${{ inputs.harness || inputs.suite == 'arithmetic-properties' && 'check_scaling_arithmetic_73' || 'check_scale_shortest_73' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: cbmc_build/bin
          key: cbmc-flat-smt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-flat-smt-cbmc.sh') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || inputs.suite == 'arithmetic-properties' && 'proof-log-arithmetic-smt-sum' || 'proof-log-normalization-scaling-kissat' }}
          run-id: ${{ inputs.artifact_run || inputs.suite == 'arithmetic-properties' && '38457183350' || '38451513946' }}
          github-token: ${{ github.token }}
          path: proof-input
      - name: Install pinned solver
        run: |
          curl --fail --location --retry 3 --output cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.2.1/cvc5-Linux-x86_64-static.zip
          echo '6d44abc233980a14d72cc5809287d27c3335b1d6ee863381d0b5ffcbd0d8de56  cvc5.zip' | sha256sum --check
          unzip -q cvc5.zip
          cat > cvc5-wrapper.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cp "$1" last-query.smt2
          ./cvc5-Linux-x86_64-static/bin/cvc5 --lang=smt2 --solve-bv-as-int="$INTEGER_MODE" "$@" \
            | tee >(awk '/^(sat|unsat|unknown)$/ { print; fflush(); }' >> solver-decisions.txt)
          SH
          chmod +x cvc5-wrapper.sh
      - name: Check every scaling property with integer arithmetic
        run: |
          [[ "$SOLVER_TIMEOUT" =~ ^[0-9]+$ && "$SOLVER_TIMEOUT" -gt 0 && "$SOLVER_TIMEOUT" -le 2400 ]]
          shopt -s globstar nullglob
          goto_files=(proof-input/**/*"$INPUT_HARNESS".out)
          [[ ${#goto_files[@]} == 1 ]]
          timeout --kill-after=5 "$SOLVER_TIMEOUT" cbmc_build/bin/cbmc \
            --no-malloc-may-fail --no-undefined-shift-check --no-signed-overflow-check \
            --nan-check --no-self-loops-to-assumptions --no-pointer-primitive-check \
            --slice-formula --object-bits 12 --symex-cache-dereferences \
            --bitwuzla --external-smt2-solver ./cvc5-wrapper.sh \
            --verbosity 9 --json-ui "${goto_files[0]}" > integer-smt.json 2> integer-smt.stderr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling-integer-smt-${{ matrix.mode }}
          path: |
            integer-smt.json
            integer-smt.stderr
            solver-decisions.txt
            last-query.smt2
