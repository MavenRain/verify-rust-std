name: PR601 proof diagnostics

on:
  push:
    branches: [codex/pr601-proof-diagnostics]
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: grid
        options: [grid, scaling, generators]

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.suite == 'generators' && '["dragon-shortest-fixed-exponent","dragon-exact-fixed-exponent"]' || inputs.suite == 'scaling' && '["scaling-profile","scaling-refinement","scaling-flat-smt"]' || '["bigint-shift-equivalence-000-031","bigint-shift-equivalence-032-063","bigint-shift-equivalence-064-095","bigint-shift-equivalence-096-127","bigint-shift-equivalence-128-159","bigint-shift-equivalence-160-191","bigint-shift-equivalence-192-223","bigint-shift-equivalence-224-229","scaling-profile"]') }}
    env:
      CARGO_BUILD_JOBS: 2
      RAYON_NUM_THREADS: 1
      KANI_JOBS: 1
      KANI_PATCHED_CBMC: 'true'
      KANI_OBJECT_BITS: ${{ inputs.suite == 'generators' && '14' || '12' }}
      PROOF_TIMEOUT: ${{ inputs.suite == 'generators' && '3600s' || '420s' }}
      KANI_SYMEX_CACHE_DEREFERENCES: 'true'
      KANI_ARRAY_FIELD_SENSITIVITY: 'true'
      HARNESS_GROUP: ${{ matrix.group }}
      SOLVER: ${{ (matrix.group == 'scaling-refinement' || matrix.group == 'scaling-flat-smt') && 'minisat' || 'kissat' }}
      KANI_FLAT_SMT_Z3: ${{ matrix.group == 'scaling-flat-smt' && 'true' || 'false' }}
      KANI_ARITHMETIC_REFINEMENT: ${{ matrix.group == 'scaling-refinement' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison clang libclang-dev gdb
      - uses: actions/cache@v4
        with:
          path: cbmc_build/bin
          key: cbmc-flat-smt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-flat-smt-cbmc.sh') }}
      - name: Build verifier and proof artifacts
        run: |
          scripts/run-kani.sh --kani-args --jobs 1 --only-codegen --exact \
            --harness num::imp::flt2dec::strategy::grisu::grisu_verify::check_scale_shortest_73
      - uses: actions/cache/save@v4
        with:
          path: cbmc_build/bin
          key: cbmc-flat-smt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-flat-smt-cbmc.sh') }}
      - name: Select proof cases
        run: |
          if [[ "$HARNESS_GROUP" == scaling-* ]]; then
            echo num::imp::flt2dec::strategy::grisu::grisu_verify::check_scale_shortest_73 > harnesses.txt
          else
            python3 -I scripts/kani-std-analysis/flt2dec_harnesses.py --group "$HARNESS_GROUP" > harnesses.txt
          fi
      - name: Verify selected proof cases
        run: |
          if [[ "$HARNESS_GROUP" == scaling-profile ]]; then
            (
              for _attempt in {1..60}; do
                cbmc_pid=$(pgrep -nx cbmc || true)
                if [[ -n "$cbmc_pid" ]]; then
                  sleep 90
                  sudo gdb -batch -ex 'set pagination off' -ex 'thread apply all bt 30' -p "$cbmc_pid" 2>&1 | tee cbmc-stack.txt || true
                  break
                fi
                sleep 10
              done
            ) &
          fi
          harness_args=()
          while IFS= read -r harness; do
            harness_args+=(--harness "$harness")
          done < harnesses.txt
          set -o pipefail
          scripts/run-kani.sh --kani-args --jobs 1 --harness-timeout "$PROOF_TIMEOUT" \
            --solver "$SOLVER" --output-format regular --exact "${harness_args[@]}" \
            2>&1 | tee proofs.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-log-${{ matrix.group }}
          path: |
            proofs.log
            cbmc-stack.txt
            target/kani_verify_std/target/**/out/*check_scale_shortest_73.out
          if-no-files-found: ignore
