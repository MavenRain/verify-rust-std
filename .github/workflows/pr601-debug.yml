name: PR 601 focused verification

on:
  push:
    branches: [codex/pr601-ci-debug]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d54ac2299dc0f4e06716264a1c73d7827635777
          submodules: recursive
      - name: Restore the pinned verifier
        id: verifier
        uses: actions/cache@v4
        with:
          path: kani_build
          key: pr601-kani-ubuntu-835817f2819435bed24f5225c76ca68355e81357
      - name: Compile the standard library and list proofs
        run: scripts/run-kani.sh --run list 2>&1 | tee compilation.log
      - name: Save the compiled verifier
        if: steps.verifier.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kani_build
          key: pr601-kani-ubuntu-835817f2819435bed24f5225c76ca68355e81357
      - name: Preserve compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr601-compilation
          path: |
            compilation.log
            kani-list.json

  verify:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        proof:
          - dragon-exact
          - grisu-shortest
          - grisu-cached-power-39
    env:
      CARGO_BUILD_JOBS: 1
      KANI_FLAT_SMT_Z3: true
      KANI_SYMEX_CACHE_DEREFERENCES: true
      KANI_ARRAY_FIELD_SENSITIVITY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d54ac2299dc0f4e06716264a1c73d7827635777
          submodules: recursive

      - name: Restore the pinned verifier
        uses: actions/cache/restore@v4
        with:
          path: kani_build
          key: pr601-kani-ubuntu-835817f2819435bed24f5225c76ca68355e81357

      - name: Verify the selected proof
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.proof }}' in
            dragon-exact)
              selected_harness=num::imp::flt2dec::strategy::dragon::dragon_verify::f32_01::check_format_exact
              ;;
            grisu-shortest)
              selected_harness=num::imp::flt2dec::strategy::grisu::grisu_verify::f32_00::check_format_shortest_opt
              ;;
            grisu-cached-power-39)
              selected_harness=num::imp::flt2dec::strategy::grisu::grisu_verify::f64_cached_power_39::check_format_shortest_opt
              ;;
          esac
          scripts/run-kani.sh --kani-args --jobs 1 --harness-timeout 600s \
            --solver minisat --output-format=terse --exact --harness "$selected_harness" \
            2>&1 | tee focused-proof.log

      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr601-${{ matrix.proof }}
          path: |
            focused-proof.log
            kani-list.json
